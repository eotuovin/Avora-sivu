<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Avora: ajanvaraus, asiakastiedot ja viikon luvut samassa järjestelmässä pienyrittäjälle. Muutto365:n tekemä.">
<meta name="theme-color" content="#08090A">
<title>Avora</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2308090A'/%3E%3Cpath d='M6 18L12 6L18 18' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='12' cy='14.2' r='1.7' fill='white'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#08090A}
*{box-sizing:border-box}
a{color:#EDEDED}a:hover{color:#FFFFFF}
input,textarea,button{font:inherit}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #8EA2FF;outline-offset:3px}
::placeholder{color:#6E737C}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,40px)}
.bal{text-wrap:balance}
.grad{background:linear-gradient(180deg,#FFFFFF 15%,#9A9DA4 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{margin:0;font-size:14px;font-weight:500;color:#8EA2FF;letter-spacing:.01em}
.h2{margin:0;font-weight:600;font-size:clamp(34px,4.4vw,54px);line-height:1.06;letter-spacing:-.035em}
.lead{color:#A1A5AD;font-size:17px}

.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .22s cubic-bezier(.16,1,.3,1),background-color .22s ease,border-color .22s ease,box-shadow .22s ease,color .22s ease}
.btn-p{background:#EDEDED;color:#08090A;border:1px solid #EDEDED}
.btn-p:hover{background:#FFFFFF;border-color:#FFFFFF;color:#08090A;transform:translateY(-1px);box-shadow:0 8px 28px rgba(255,255,255,.14)}
.btn-p:active{transform:translateY(0) scale(.98);box-shadow:none}
.btn-g{background:rgba(255,255,255,.03);color:#EDEDED;border:1px solid rgba(255,255,255,.14)}
.btn-g:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.3);color:#FFFFFF;transform:translateY(-1px)}
.btn-g:active{transform:translateY(0) scale(.98)}
.btn-sm{height:36px;padding:0 16px;font-size:14px;font-weight:500}
.tap{transition:transform .2s cubic-bezier(.16,1,.3,1),background-color .25s ease,color .25s ease,border-color .25s ease}
.tap:hover{transform:translateY(-1px)}
.tap:active{transform:scale(.97)}
.nl{color:#A1A5AD;text-decoration:none;font-size:14px;transition:color .2s ease}
.nl:hover{color:#FFFFFF}
.fl{color:#8A8F98;text-decoration:none;transition:color .2s ease}
.fl:hover{color:#FFFFFF}

@keyframes enter{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes enterBig{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-3%)}to{transform:translateX(3%)}}
@keyframes tilt{from{transform:perspective(1400px) rotateX(10deg) scale(.97)}to{transform:none}}
@keyframes swap{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.e1{animation:enter .8s cubic-bezier(.16,1,.3,1) 0s both}
.e2{animation:enter .8s cubic-bezier(.16,1,.3,1) .1s both}
.e3{animation:enter .8s cubic-bezier(.16,1,.3,1) .2s both}
.e4{animation:enter .8s cubic-bezier(.16,1,.3,1) .3s both}
.e5{animation:enterBig .9s cubic-bezier(.16,1,.3,1) .42s both}
.row-in{animation:rowIn .6s cubic-bezier(.16,1,.3,1) both}
.spark{stroke-dasharray:600;animation:draw 2s cubic-bezier(.4,0,.2,1) 1.2s both}
.horizon{animation:breathe 9s ease-in-out infinite}
.drift{animation:drift 40s ease-in-out infinite alternate}
.swap{animation:swap .55s cubic-bezier(.16,1,.3,1) both}
@supports (animation-timeline: view()){
.tilt{transform-origin:top center;animation:tilt linear both;animation-timeline:view();animation-range:entry 15% cover 45%}
}
.rv{transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.rv-ready .rv:not(.in){opacity:0;transform:translateY(20px)}
.bar{display:block;height:100%;border-radius:999px;transform-origin:left;transition:transform 1.1s cubic-bezier(.16,1,.3,1) .25s}
.rv-ready .rv:not(.in) .bar{transform:scaleX(0)}

.nav-r{display:flex;align-items:center;gap:24px}
.benefits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:64px}
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:72px;align-items:center}
.feat.flip>.ftext{order:2}
.pkg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:56px}
.pkg-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
.trust{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:start}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);height:100%}
.app-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.fld{width:100%;height:48px;background:#08090A;border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#EDEDED;padding:0 14px;font-size:15px;transition:border-color .2s ease}
.fld:hover{border-color:rgba(255,255,255,.2)}
.fld:focus{border-color:rgba(142,162,255,.7);outline:none}
.area{height:96px;padding-top:12px;resize:vertical}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details[open] .plus{transform:rotate(45deg)}
.plus{display:inline-block;transition:transform .25s ease}
.ph{color:#8A8F98;font-style:italic}
.price-scroll{overflow-x:auto;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:#0B0C0E}
.ptable{width:100%;min-width:700px;border-collapse:collapse;font-size:15px;table-layout:fixed}
.ptable th,.ptable td{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center;vertical-align:middle;color:#A1A5AD;line-height:1.45;font-weight:400}
.ptable tbody tr:last-child th,.ptable tbody tr:last-child td{border-bottom:0}
.ptable .lbl{text-align:left;color:#EDEDED;font-weight:500;width:22%;position:sticky;left:0;z-index:1;background:#0B0C0E}
.ptable thead th{background:#111215;padding:22px 18px 22px;vertical-align:top}
.ptable .badge{display:block;width:fit-content;margin:0 auto 10px}
.badge{white-space:nowrap}
.badge-sp{display:block;height:32px}
.ptable thead th.lbl{background:#111215}
.ptable .hl{background:rgba(142,162,255,.07)}
.ptable thead th.hl{background:#151827}
.hl-top{box-shadow:inset 0 2px 0 #8EA2FF}
.pname{display:block;font-size:20px;font-weight:600;color:#FFFFFF;letter-spacing:-.015em}
.ptag{display:block;margin-top:4px;font-size:13px;color:#8A8F98}
.badge{display:inline-block;margin-bottom:10px;height:22px;line-height:16px;padding:3px 10px;border-radius:999px;background:#8EA2FF;color:#08090A;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ptable td.big{font-size:22px;font-weight:600;color:#FFFFFF;letter-spacing:-.02em}
.ptable td.mid{font-size:17px;font-weight:600;color:#EDEDED}
.ptable td.no{color:#7A7F88}
.ptable .cta-row td{padding:24px 18px}
.ptable .cta-row .btn{width:100%;max-width:220px}
.pstack{display:none}
.prow{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.07);font-size:14px;line-height:1.45}
@media (max-width:960px){
.nav-links{display:none !important}
.feat,.pkg,.trust{grid-template-columns:minmax(0,1fr);gap:40px}
.feat.flip>.ftext{order:0}
.steps{grid-template-columns:repeat(2,minmax(0,1fr))}
.app{grid-template-columns:minmax(0,1fr)}
.app-side{display:none !important}
.app-main{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
.tilt,.horizon,.drift{animation:none !important}
.benefits,.pkg-sum{grid-template-columns:minmax(0,1fr)}
.app-right{display:none !important}
.heroviz{height:400px !important}
.cal{grid-template-columns:repeat(3,minmax(0,1fr))}
.cal>.cal-x{display:none !important}
}
@media (max-width:860px){
.price-scroll{display:none}
.pstack{display:flex;flex-direction:column;gap:16px}
}
@media (max-width:560px){
.steps,.fields{grid-template-columns:minmax(0,1fr)}
.btn:not(.btn-sm){height:48px}
.chip-st{display:none}
.segb{padding:0 11px !important;font-size:13px !important}
}
@media (prefers-reduced-motion: reduce){
*,*::before,*::after{animation:none !important;transition:none !important}
.rv-ready .rv:not(.in){opacity:1;transform:none}
.rv-ready .rv:not(.in) .bar{transform:none}
}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">

<div style="background: #08090A; color: #EDEDED; font-family: 'Onest', system-ui, sans-serif; font-size: 16px; line-height: 1.6; min-height: 100vh; overflow-x: clip">

<header style="position: sticky; top: 0; z-index: 20; background: rgba(8,9,10,.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,.06)">
<div class="wrap" style="display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 20px">
<a href="#top" style="display: inline-flex; align-items: center; gap: 10px; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 18px; letter-spacing: -.01em">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20L12 4L20 20" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="12" cy="15.5" r="2.1" fill="#FFFFFF"></circle></svg>
Avora</a>
<div class="nav-r">
<nav class="nav-links" aria-label="Päävalikko" style="display: flex; gap: 24px; align-items: center">
<a class="nl" href="#ominaisuudet">Mitä se tekee</a>
<a class="nl" href="#paketit">Hinnat</a>
<a class="nl" href="#kysymykset">Kysymykset</a>
<a class="nl" href="tel:[PUHELIN]" style="color: #EDEDED">Soita [PUHELIN]</a>
</nav>
<a class="btn btn-g btn-sm" href="#varaa">Varaa esittely</a>
</div>
</div>
</header>

<section id="top" style="position: relative; padding: clamp(72px,10vw,130px) 0 0; overflow: hidden">
<div aria-hidden="true" class="drift" style="position: absolute; left: -10%; right: -10%; top: 0; height: 900px; background: radial-gradient(50% 50% at 50% 0%, rgba(255,255,255,.10), rgba(255,255,255,0) 70%); pointer-events: none"></div>
<div class="wrap" style="position: relative; text-align: center">
<p class="e1" style="display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03); font-size: 13px; color: #A1A5AD">
<span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #8EA2FF; display: inline-block"></span>
Pienyrittäjälle, Muutto365:n tekemä</p>
<h1 class="e2 grad bal" style="margin: 28px auto 0; max-width: 820px; font-weight: 600; font-size: clamp(42px,7vw,84px); line-height: 1.02; letter-spacing: -.04em">Varaukset ja asiakkaat yhdessä paikassa</h1>
<p class="e3 bal" style="margin: 24px auto 0; max-width: 580px; font-size: clamp(17px,1.6vw,19px); color: #A1A5AD">Vihko, seinäkalenteri ja viestiketjut vaihtuvat yhteen selkeään järjestelmään. Asiakas varaa ajan netistä, ja kaikki tallentuu itsestään.</p>
<div class="e4" style="margin-top: 36px">
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px">
<a class="btn btn-p" href="#varaa">Varaa maksuton esittely</a>
<a class="btn btn-g" href="#paketit">Katso hinnat</a>
</div>
<p style="margin: 16px 0 0; font-size: 14px; color: #8A8F98">30 min puhelimessa tai etänä. Ei sitoumuksia.</p>
</div>
</div>

<div class="wrap" style="position: relative; margin-top: clamp(48px,6vw,72px)">
<div class="e5" style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 14px; margin-bottom: 28px">
<span style="font-size: 14px; color: #8A8F98">Katso esimerkki:</span>
<div role="group" aria-label="Esimerkkiala" style="display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid rgba(255,255,255,.1); background: #0C0D0F">
<sc-for list="{{ inds }}" as="d" hint-placeholder-count="3">
<button type="button" class="tap segb" onClick="{{ d.pick }}" aria-pressed="{{ d.pressed }}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: {{ d.bg }}; color: {{ d.color }}; cursor: pointer; font-size: 14px; font-weight: 500">{{ d.label }}</button>
</sc-for>
</div>
</div>
<div aria-hidden="true" class="horizon" style="position: absolute; left: 50%; top: 190px; width: 170%; height: 900px; transform: translateX(-50%); border-radius: 50%; border-top: 1px solid rgba(255,255,255,.26); background: radial-gradient(50% 32% at 50% 0%, rgba(142,162,255,.10), rgba(255,255,255,.03) 60%, rgba(255,255,255,0) 100%); pointer-events: none"></div>
<div class="e5" style="position: relative">
<div class="tilt heroviz" role="img" aria-label="{{ ind.aria }}" style="max-width: 1080px; height: 540px; margin: 0 auto; border-radius: 16px 16px 0 0; border: 1px solid rgba(255,255,255,.12); border-bottom: 0; background: #0C0D0F; overflow: hidden; -webkit-mask-image: linear-gradient(180deg,#000 68%,transparent 100%); mask-image: linear-gradient(180deg,#000 68%,transparent 100%)">
<div class="app" style="text-align: left; font-size: 13px">
<div class="app-side" style="border-right: 1px solid rgba(255,255,255,.07); background: #0A0B0C; padding: 18px 14px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 8px; padding: 0 8px 16px; font-weight: 600; font-size: 14px; color: #FFFFFF">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20L12 4L20 20" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="12" cy="15.5" r="2.2" fill="#FFFFFF"></circle></svg>{{ ind.biz }}</div>
<div style="height: 32px; border-radius: 8px; background: #8EA2FF; color: #08090A; display: flex; align-items: center; justify-content: center; font-weight: 600; margin-bottom: 14px">Uusi varaus</div>
<div style="padding: 7px 10px; border-radius: 7px; background: rgba(255,255,255,.06); color: #FFFFFF">Tänään</div>
<div style="padding: 7px 10px; color: #8A8F98">Kalenteri</div>
<div style="padding: 7px 10px; color: #8A8F98">Asiakkaat</div>
<div style="padding: 7px 10px; color: #8A8F98">Viikon luvut</div>
<div style="margin-top: auto; padding: 7px 10px; color: #8A8F98">Asetukset</div>
</div>
<div style="padding: 26px 28px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 20px">
<span style="font-size: 20px; font-weight: 600; color: #FFFFFF; letter-spacing: -.01em">{{ ind.hello }}</span>
<span style="color: #8A8F98">Perjantai</span>
</div>
<div class="app-main">
<div style="border: 1px solid rgba(255,255,255,.08); border-radius: 12px; background: #101114; padding: 16px">
<div style="display: flex; justify-content: space-between; margin-bottom: 10px"><span style="font-weight: 600; color: #EDEDED">{{ ind.listTitle }}</span><span style="color: #8A8F98">{{ ind.count }}</span></div>
<sc-if value="{{ isK }}" hint-placeholder-val="{{ true }}">
<sc-for list="{{ ind.rows }}" as="r" hint-placeholder-count="5">
<div class="row-in" style="animation-delay: {{ r.delay }}; display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid rgba(255,255,255,.06)"><span style="color: #8A8F98">{{ r.t }}</span><span style="color: #EDEDED; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ r.n }}</span><span class="chip-st" style="padding: 2px 8px; border-radius: 999px; border: 1px solid {{ r.bd }}; background: {{ r.bg }}; color: {{ r.fg }}; font-size: 12px">{{ r.s }}</span></div>
</sc-for>
</sc-if>
<sc-if value="{{ isA }}" hint-placeholder-val="{{ false }}">
<sc-for list="{{ ind.rows }}" as="r" hint-placeholder-count="5">
<div class="row-in" style="animation-delay: {{ r.delay }}; display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid rgba(255,255,255,.06)"><span style="color: #8A8F98">{{ r.t }}</span><span style="color: #EDEDED; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ r.n }}</span><span class="chip-st" style="padding: 2px 8px; border-radius: 999px; border: 1px solid {{ r.bd }}; background: {{ r.bg }}; color: {{ r.fg }}; font-size: 12px">{{ r.s }}</span></div>
</sc-for>
</sc-if>
<sc-if value="{{ isM }}" hint-placeholder-val="{{ false }}">
<sc-for list="{{ ind.rows }}" as="r" hint-placeholder-count="5">
<div class="row-in" style="animation-delay: {{ r.delay }}; display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid rgba(255,255,255,.06)"><span style="color: #8A8F98">{{ r.t }}</span><span style="color: #EDEDED; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ r.n }}</span><span class="chip-st" style="padding: 2px 8px; border-radius: 999px; border: 1px solid {{ r.bd }}; background: {{ r.bg }}; color: {{ r.fg }}; font-size: 12px">{{ r.s }}</span></div>
</sc-for>
</sc-if>
</div>
<div class="app-right" style="display: flex; flex-direction: column; gap: 16px">
<div style="border: 1px solid rgba(255,255,255,.08); border-radius: 12px; background: #101114; padding: 16px">
<div style="font-weight: 600; color: #EDEDED; margin-bottom: 10px">Uudet asiakkaat</div>
<sc-for list="{{ ind.news }}" as="c" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,.06)"><span style="color: #EDEDED">{{ c.n }}</span><span style="color: #8A8F98">{{ c.s }}</span></div>
</sc-for>
</div>
<div style="border: 1px solid rgba(255,255,255,.08); border-radius: 12px; background: #101114; padding: 16px">
<div style="color: #8A8F98">Varauksia tällä viikolla</div>
<div style="font-size: 26px; font-weight: 600; color: #FFFFFF; letter-spacing: -.02em; margin-top: 4px">{{ ind.week }}</div>
<svg viewBox="0 0 240 70" width="100%" height="70" aria-hidden="true" style="display: block; margin-top: 8px"><path class="spark" d="M0 58 L30 52 L60 55 L90 40 L120 44 L150 30 L180 33 L210 18 L240 10" fill="none" stroke="#8EA2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
<p style="position: relative; margin: 12px 0 0; text-align: center; font-size: 12px; color: #6E737C">Esimerkkinäkymä, nimet keksittyjä</p>
</div>
</section>

<section style="padding: 72px 0 0">
<div class="wrap" style="text-align: center">
<p class="rv bal" style="margin: 0 auto; max-width: 780px; font-size: clamp(21px,2.4vw,28px); line-height: 1.4; letter-spacing: -.015em; font-weight: 500; color: #6E737C">Ajat seinäkalenterissa, asiakkaat puhelimessa ja muistiinpanot vihkossa? <span style="color: #EDEDED">Avorassa ne ovat samassa paikassa, ja asiakas voi varata ajan itse silloinkin, kun sinulla on kädet täynnä töitä.</span></p>
</div>
</section>

<section style="padding: clamp(100px,12vw,160px) 0 0">
<div class="wrap">
<div style="max-width: 640px; margin-bottom: 56px">
<p class="rv eyebrow">Mitä hyötyä</p>
<h2 class="rv h2 grad bal" style="margin-top: 12px">Vähemmän puhelimessa roikkumista, enemmän aikaa työlle</h2>
</div>
<div class="benefits">
<div class="rv" style="border-top: 1px solid rgba(255,255,255,.1); padding: 28px 0 36px">
<h3 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.015em; color: #FFFFFF">Asiakkaat varaavat itse</h3>
<p class="lead" style="margin: 8px 0 0; max-width: 460px">Myös illalla ja viikonloppuna. Sinun ei tarvitse vastata puhelimeen kesken työn.</p>
</div>

          this._sending = false;
          track('avora_form_submit', { package: s.fpkg || 'ei valittu', call_time: s.when || 'ei valittu',
            contact_method: s.phone.trim() ? 'puhelin' : 'sahkoposti',
            details_given: (s.email.trim() || s.company.trim() || s.msg.trim()) ? 'kylla' : 'ei',
            industry_example: s.ind });
          this.setState({ sent: true, err: '' });
        })
        .catch((err) => {
          this._sending = false;
          track('avora_form_error', { status: String(err && err.message || 'network').slice(0, 20) });
          this.setState({ err: 'Lähetys ei onnistunut. Yritä hetken päästä uudelleen tai soita meille.' });
        });
    };
    const whenTxt = { aamu: ' aamupäivällä', ip: ' iltapäivällä', ilta: ' illalla' }[s.when] || '';
    const thanks = (s.phone.trim()
      ? 'Soitamme sinulle pian' + whenTxt + ' ja sovitaan sopiva hetki esittelylle.'
      : 'Laitamme sinulle pian viestiä ja sovitaan sopiva hetki esittelylle.');
    return {
      inds: inds, ind: ind,
      isK: s.ind === 'k', isA: s.ind === 'a', isM: s.ind === 'm',
      tabs: tabs, p: p,
      isStart: s.pkg === 'start', isKasvu: s.pkg === 'kasvu', isKoko: s.pkg === 'kokonaisuus',
      bookPkg: () => this.setState({ fpkg: s.pkg, err: '' }),
      pcols: pcols,
      bookStart: () => this.setState({ fpkg: 'start', err: '' }),
      bookKasvu: () => this.setState({ fpkg: 'kasvu', err: '' }),
      bookKoko: () => this.setState({ fpkg: 'kokonaisuus', err: '' }),
      fopts: fopts, whens: whens,
      f: s,
      notSent: !s.sent,
      hasErr: !!s.err,
      onName: field('name'), onCompany: field('company'), onEmail: field('email'), onPhone: field('phone'), onMsg: field('msg'),
      onConsent: (e) => this.setState({ consent: !!(e && e.target && e.target.checked), err: '' }),
      submit: submit,
      firstName: s.name.trim().split(/\s+/)[0] || '',
      thanks: thanks,
      reset: () => this.setState({ sent: false, name: '', company: '', email: '', phone: '', msg: '', consent: false, fpkg: '', when: '', err: '' })
    };
  }
}

AvoraBoot(Component);
</script>
</body>
</html>
